site_name: Machine Learning Security (ML-Sec)
site_description: A self-study, lab-driven course on adversarial machine learning, privacy, and secure ML engineering.
site_url: https://nadeem-majeedch.github.io/MLSec/
repo_url: https://github.com/nadeem-majeedch/MLSec
docs_dir: docs
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/site.css
  - stylesheets/self-check.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/self-check.js

# Planning, maintainer, and answer documents are built but kept out of student navigation.
not_in_nav: |
  /course-blueprint.md
  /module-map.md
  /lab-catalog.md
  /learning-outcomes.md
  /implementation-roadmap.md
  /maintainer-guide.md
